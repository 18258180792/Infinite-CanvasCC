        function detachActiveTaskStream(){
            if(activeTaskStreamController){
                try { activeTaskStreamController.abort(); } catch(e) {}
                activeTaskStreamController = null;
            }
            activeTaskStreamId = '';
            sending = false;
            const sendBtn = document.getElementById('sendBtn');
            if(sendBtn) sendBtn.disabled = false;
            updateSendButtonState();
        }

        async function retryAssistantMessage(assistantMsgId){
            if(sending) return;
            const msgs = currentConversation?.messages || [];
            const idx = msgs.findIndex(m => m && m.id === assistantMsgId);
            if(idx < 0) return;
            let userMsg = null;
            for(let i = idx - 1; i >= 0; i--){
                if(msgs[i]?.role === 'user'){ userMsg = msgs[i]; break; }
            }
            if(!userMsg) return;
            if(userMsg.mode && ['chat', 'agent', 'image'].includes(userMsg.mode) && userMsg.mode !== mode){
                setMode(userMsg.mode);
            }
            const input = document.getElementById('messageInput');
            if(input){
                input.value = userMsg.content || '';
                onComposerInput(input);
            }
            if(Array.isArray(userMsg.attachments) && userMsg.attachments.length){
                refs = userMsg.attachments.slice(0, CHAT_ATTACHMENT_MAX);
                renderRefs();
            }
            await sendMessage();
        }

        async function attachChatTaskStream(taskId, assistantBubble, conversationId, startedAt = Date.now()){
            if(!taskId) return;
            detachActiveTaskStream();
            activeTaskStreamId = taskId;
            const controller = new AbortController();
            activeTaskStreamController = controller;
            sending = true;
            const sendBtn = document.getElementById('sendBtn');
            if(sendBtn) sendBtn.disabled = true;

            let stageMessage = mode === 'image' ? tr('chat.generatingImage') : '正在思考与连接…';
            const updateStatus = () => {
                if(!assistantBubble?.status) return;
                const elapsed = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
                assistantBubble.status.hidden = false;
                assistantBubble.status.classList.remove('error');
                assistantBubble.status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(stageMessage)} · ${elapsed} 秒</span>`;
            };
            if(assistantBubble){
                assistantBubble.bubble.classList.add('streaming');
                updateStatus();
            }
            const statusTimer = setInterval(updateStatus, 1000);
            let reader = null;

            try {
                const res = await fetch(`/api/chat/tasks/${encodeURIComponent(taskId)}/stream`, {
                    method:'GET',
                    headers:headers(),
                    signal:controller.signal
                });
                if(!res.ok){
                    if(res.status === 404 && conversationId){
                        await openConversation(conversationId);
                        return;
                    }
                    throw new Error(await responseErrorMessage(res, tr('chat.requestFailed')));
                }
                if(!res.body) throw new Error('浏览器未提供流式响应，请刷新后重试。');
                reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullText = '';
                let reasoning = '';
                let completed = false;
                let errored = false;

                const handleEvent = async eventText => {
                    if(controller.signal.aborted || activeTaskStreamId !== taskId) return;
                    const data = eventText.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
                    if(!data || data === '[DONE]') return;
                    const event = JSON.parse(data);
                    if(event.type === 'status'){
                        stageMessage = event.message || '正在处理…';
                        updateStatus();
                    } else if(event.type === 'plan'){
                        if(event.action !== 'chat' && assistantBubble){
                            renderFormattedText(assistantBubble.text, event.reply || (event.action === 'edit_image' ? '正在修改图片' : '正在生成图片'));
                            if(event.prompt) setMessageDetail(assistantBubble.bubble, 'prompt-detail', '生图文案', event.prompt);
                        }
                        scrollBottom();
                    } else if(event.type === 'delta'){
                        fullText += event.delta || '';
                        if(assistantBubble) renderFormattedText(assistantBubble.text, fullText);
                        scrollBottom();
                    } else if(event.type === 'reasoning'){
                        reasoning += event.delta || '';
                        if(assistantBubble) setMessageDetail(assistantBubble.bubble, 'reasoning-detail', '思考过程', reasoning);
                        scrollBottom();
                    } else if(event.type === 'image'){
                        if(assistantBubble) appendStreamImage(assistantBubble, event.url);
                        scrollBottom();
                    } else if(event.type === 'partial'){
                        if(currentConversation?.id === conversationId && event.conversation){
                            currentConversation = event.conversation;
                            rememberConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                        }
                    } else if(event.type === 'error'){
                        errored = true;
                        clearInterval(statusTimer);
                        assistantBubble?.bubble?.classList.remove('streaming');
                        if(currentConversation?.id === conversationId && event.conversation){
                            currentConversation = event.conversation;
                            renderMessages(currentConversation.messages || []);
                            loadConversations().catch(() => {});
                        } else if(assistantBubble?.status){
                            assistantBubble.status.hidden = false;
                            assistantBubble.status.classList.add('error');
                            assistantBubble.status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(event.detail || tr('chat.requestFailed'))}</span>`;
                        }
                    } else if(event.type === 'done'){
                        completed = true;
                        clearInterval(statusTimer);
                        assistantBubble?.bubble?.classList.remove('streaming');
                        if(currentConversation?.id === conversationId && event.conversation){
                            currentConversation = event.conversation;
                            rememberConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                            renderMessages(currentConversation.messages || []);
                        }
                        await loadConversations().catch(() => {});
                    }
                };

                while(!completed && !errored){
                    const {value, done} = await reader.read();
                    buffer += done ? decoder.decode() : decoder.decode(value, {stream:true});
                    let separator;
                    while((separator = /\r?\n\r?\n/.exec(buffer))){
                        const eventText = buffer.slice(0, separator.index);
                        buffer = buffer.slice(separator.index + separator[0].length);
                        await handleEvent(eventText);
                    }
                    if(done){
                        if(buffer.trim()) await handleEvent(buffer);
                        break;
                    }
                }
                if(!completed && !errored && !controller.signal.aborted && activeTaskStreamId === taskId){
                    throw new Error('连接已中断，任务仍在后台执行，可刷新页面恢复查看。');
                }
            } catch(err) {
                if(err?.name === 'AbortError' || controller.signal.aborted || activeTaskStreamId !== taskId) return;
                clearInterval(statusTimer);
                assistantBubble?.bubble?.classList.remove('streaming');
                if(assistantBubble?.status){
                    assistantBubble.status.hidden = false;
                    assistantBubble.status.classList.add('error');
                    assistantBubble.status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(err.message || tr('chat.requestFailed'))}</span>`;
                }
            } finally {
                clearInterval(statusTimer);
                if(reader){
                    await reader.cancel().catch(() => {});
                    try { reader.releaseLock(); } catch(e) {}
                }
                assistantBubble?.bubble?.classList.remove('streaming');
                if(activeTaskStreamId === taskId){
                    activeTaskStreamId = '';
                    activeTaskStreamController = null;
                    sending = false;
                    if(sendBtn) sendBtn.disabled = false;
                    updateSendButtonState();
                    scrollBottom();
                }
            }
        }

        async function sendMessage(){
            if(sending) return;
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(!message) return;
            sending = true;
            const sendBtn = document.getElementById('sendBtn');
            if(sendBtn) sendBtn.disabled = true;
            const requestMode = mode;
            const requestSystemPrompt = currentSystemPrompt();
            closeAllPopovers();
            const requestedSize = chatSizeFromPrompt(message);
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            onComposerInput(input);
            if(!currentConversation){
                currentConversation = {id:'', title:'新对话', messages:[]};
                document.getElementById('messages').innerHTML = '';
            }
            document.querySelector('#messages .empty-state')?.remove();
            addMessageBubble({role:'user', content:message, attachments:pendingRefs});
            const assistantBubble = addMessageBubble({
                role:'assistant',
                content:'',
                status:'running',
                status_text: requestMode === 'image' ? tr('chat.generatingImage') : '正在思考与连接…'
            });
            scrollBottom();
            let attachedTask = false;
            try {
                if(requestMode !== 'image' && !selectedProviderHasModels('chat')) throw new Error('当前对话线路没有可用的聊天模型，请先切换对话线路。');
                if(requestMode === 'image' && !selectedProviderHasModels('image')) throw new Error('当前生图线路没有可用的生图模型，请先切换生图线路。');
                const requestResolution = chatResolutionForRequest(message, requestedSize);
                const requestAspectRatio = currentChatAspectRatio();
                const payload = {
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: requestSystemPrompt,
                    skill_ids: chatSkillIds,
                    mode: requestMode,
                    size: requestedSize,
                    aspect_ratio: requestAspectRatio,
                    resolution: requestResolution,
                    model: provider === 'modelscope' ? (msModel || activeChatModel) : (activeChatModel || config.chat_model),
                    ms_model: provider === 'modelscope' ? (msModel || activeChatModel) : '',
                    image_model: activeImageModel || config.image_model,
                    reference_images: pendingRefs,
                    provider: requestMode === 'image' ? activeImageProvider : provider,
                    image_provider: activeImageProvider,
                    reasoning_effort: requestMode !== 'image' && supportsReasoningEffort() ? reasoningEffort : ''
                };
                const res = await fetch('/api/chat/tasks', {
                    method:'POST',
                    headers:headers(),
                    body:JSON.stringify(payload)
                });
                if(!res.ok) throw new Error(await responseErrorMessage(res, tr('chat.requestFailed')));
                const data = await res.json();
                currentConversation = data.conversation;
                rememberConversation(currentConversation.id);
                setChatTitle(currentConversation.title);
                renderMessages(currentConversation.messages || []);
                loadConversations().catch(() => {});
                const bubble = renderedBubblesById.get(data.message?.id) || null;
                attachedTask = true;
                await attachChatTaskStream(data.task_id, bubble, currentConversation.id, data.message?.created_at || Date.now());
            } catch(err) {
                if(!attachedTask && assistantBubble?.status){
                    assistantBubble.bubble.classList.remove('streaming');
                    assistantBubble.status.hidden = false;
                    assistantBubble.status.classList.add('error');
                    assistantBubble.status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(err.message || tr('chat.requestFailed'))}</span>`;
                }
            } finally {
                if(!attachedTask){
                    sending = false;
                    if(sendBtn) sendBtn.disabled = false;
                    updateSendButtonState();
                }
                scrollBottom();
            }
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            loadPromptPresets();
            if(window.LLMSkills) LLMSkills.load().then(syncSystemPromptUI).catch(() => {});
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await loadConversations();
            updateSendButtonState();
        };
    </script>
</body>
</html>
