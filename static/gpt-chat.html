<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>Agent智能改图</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.11.23.1.1794902612"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.11.23.1.1794902611"></script>
    <script src="/static/js/theme.js?v=2026.11.23.1.1795234217"></script>
    <script src="/static/js/i18n.js?v=2026.11.23.1.1794902556"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.11.23.1.1795232862">
    <link rel="stylesheet" href="/static/css/llm-skills.css?v=2026.11.23.1.1794902531">
    <link rel="stylesheet" href="/static/css/studio-unified.css?v=2026.11.23.1.1795276495">
    <script src="/static/js/llm-skills.js?v=2026.11.23.1.1794902565"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.11.23.1.1794902588');
        :root {
            --ease:cubic-bezier(.4,0,.2,1);
            --chat-bg:#f8fafc;
            --chat-panel:#ffffff;
            --chat-panel-2:#f1f5f9;
            --chat-soft:#e2e8f0;
            --chat-soft-2:#eef2f7;
            --chat-line:rgba(15,23,42,.09);
            --chat-line-2:rgba(15,23,42,.16);
            --chat-text:#0f172a;
            --chat-muted:#64748b;
            --chat-faint:#94a3b8;
            --chat-strong:#0f172a;
            --chat-strong-text:#ffffff;
            --chat-user-bg:#eef2f6;
            --chat-user-text:#0f172a;
            --chat-popover-bg:rgba(255,255,255,.98);
            --chat-popover-shadow:0 20px 54px rgba(15,23,42,.14), 0 0 0 1px rgba(15,23,42,.06);
            --chat-active-bg:#e2e8f0;
            --chat-active-text:#0f172a;
            --chat-active-border:rgba(15,23,42,.12);
            --chat-shadow:rgba(15,23,42,.08);
            --chat-width:800px;
        }
        html.studio-theme-dark,
        body.studio-theme-dark,
        html.theme-dark,
        body.theme-dark {
            --chat-bg:#0e0f12;
            --chat-panel:#1a1b20;
            --chat-panel-2:#141519;
            --chat-soft:#24262e;
            --chat-soft-2:#2b2d36;
            --chat-line:rgba(255,255,255,.08);
            --chat-line-2:rgba(255,255,255,.15);
            --chat-text:#ececf1;
            --chat-muted:#9ca3af;
            --chat-faint:#6b7280;
            --chat-strong:#f4f4f6;
            --chat-strong-text:#0e0f12;
            --chat-user-bg:#23242a;
            --chat-user-text:#f4f4f5;
            --chat-popover-bg:rgba(25,26,32,.98);
            --chat-popover-shadow:0 24px 64px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.08);
            --chat-active-bg:#2a2c35;
            --chat-active-text:#f4f4f6;
            --chat-active-border:rgba(255,255,255,.14);
            --chat-shadow:rgba(0,0,0,.46);
        }
        * { box-sizing:border-box; }
        html { height:100%; overflow:hidden; }
        body {
            position:fixed; top:0; left:0; width:100%; margin:0; height:100vh; overflow:hidden;
            background:var(--chat-bg); color:var(--chat-text);
            font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            -webkit-font-smoothing:antialiased;
        }
        html.studio-ui-scaled body:not(.studio-scale-host) {
            width:calc(100vw / var(--studio-ui-scale, 1)) !important;
        }
        button,input,select,textarea { font:inherit; }
        button { border:0; cursor:pointer; background:transparent; color:inherit; }
        .chat-shell {
            height:calc(100vh / var(--studio-ui-scale, 1));
            min-width:0; display:block; background:var(--chat-bg);
        }
        .chat-main {
            width:100%; height:100%; min-width:0; min-height:0;
            position:relative; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden;
        }

        /* ===== Topbar (LibTV Minimalist Header) ===== */
        .topbar {
            height:52px; min-height:52px; padding:0 20px;
            background:var(--chat-bg); border-bottom:1px solid transparent; z-index:20;
        }
        .topbar-inner {
            height:100%; width:100%; margin:0 auto;
            display:flex; align-items:center; justify-content:space-between; gap:16px;
        }
        .title-block {
            position:relative; min-width:0; display:flex; align-items:center;
        }
        .title-switcher {
            height:32px; max-width:min(420px, 60vw); padding:0 10px 0 8px;
            border-radius:9px; display:inline-flex; align-items:center; gap:6px;
            color:var(--chat-text); font-size:13.5px; font-weight:600;
            transition:background .15s var(--ease), color .15s var(--ease);
        }
        .title-switcher:hover,
        .title-switcher.open { background:var(--chat-soft-2); }
        #chatTitle {
            min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .title-switcher i, .title-switcher svg {
            width:14px; height:14px; color:var(--chat-muted); flex:0 0 auto;
            transition:transform .16s var(--ease);
        }
        .title-switcher.open i, .title-switcher.open svg { transform:rotate(180deg); }

        .top-actions {
            position:relative; display:flex; align-items:center; gap:4px;
        }
        .top-icon-btn {
            position:relative; width:32px; height:32px; border-radius:9px;
            display:inline-flex; align-items:center; justify-content:center;
            color:var(--chat-muted); transition:background .15s var(--ease), color .15s var(--ease);
        }
        .top-icon-btn:hover,
        .top-icon-btn.open { background:var(--chat-soft-2); color:var(--chat-text); }
        .top-icon-btn i, .top-icon-btn svg { width:16px; height:16px; }
        .top-icon-dot {
            position:absolute; top:6px; right:6px; width:6px; height:6px;
            border-radius:999px; background:#60a5fa; display:none;
        }
        .top-icon-btn.has-dot .top-icon-dot { display:block; }

        /* History Popover (anchored under #titleHistoryBtn or .top-actions) */
        .chat-rail {
            position:absolute; top:calc(100% + 6px); left:0;
            width:min(320px, calc(100vw - 32px)); max-height:min(480px, calc(100vh - 96px));
            display:none; flex-direction:column; gap:8px; padding:12px;
            background:var(--chat-popover-bg); border:1px solid var(--chat-line);
            border-radius:16px; color:var(--chat-text); overflow:hidden;
            box-shadow:var(--chat-popover-shadow); backdrop-filter:blur(20px); z-index:85;
        }
        .chat-rail.open { display:flex; animation:popDown .16s var(--ease); }
        .rail-head {
            display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 4px 6px;
            border-bottom:1px solid var(--chat-line);
        }
        .rail-title { font-size:13px; font-weight:700; color:var(--chat-text); }
        .rail-new-inline {
            height:26px; padding:0 9px; border-radius:8px;
            display:inline-flex; align-items:center; gap:4px;
            background:var(--chat-soft); color:var(--chat-text);
            font-size:11.5px; font-weight:650; transition:background .15s var(--ease);
        }
        .rail-new-inline:hover { background:var(--chat-soft-2); }
        .rail-new-inline i, .rail-new-inline svg { width:13px; height:13px; }
        .thread-list {
            flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:4px;
            padding:2px; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.22) transparent;
        }
        .thread-row { position:relative; min-width:0; }
        .thread-item {
            width:100%; min-height:48px; min-width:0; border:1px solid transparent;
            border-radius:10px; padding:8px 32px 8px 10px; text-align:left; color:var(--chat-text);
            transition:background .14s var(--ease), border-color .14s var(--ease);
        }
        .thread-item:hover { background:var(--chat-soft-2); }
        .thread-item.active {
            background:var(--chat-active-bg); color:var(--chat-active-text);
            border-color:var(--chat-active-border);
        }
        .thread-delete {
            position:absolute; top:50%; transform:translateY(-50%); right:6px;
            width:22px; height:22px; border-radius:6px;
            display:flex; align-items:center; justify-content:center;
            color:var(--chat-faint); opacity:0; transition:opacity .14s var(--ease), background .14s var(--ease);
        }
        .thread-row:hover .thread-delete,
        .thread-row:focus-within .thread-delete { opacity:1; }
        .thread-delete:hover { background:var(--chat-soft); color:var(--chat-text); }

        /* System Prompt Popover */
        .system-prompt-popover {
            position:absolute; top:calc(100% + 6px); right:0;
            width:min(440px, calc(100vw - 28px)); display:none; flex-direction:column; gap:10px; padding:14px;
            background:var(--chat-popover-bg); border:1px solid var(--chat-line);
            border-radius:16px; color:var(--chat-text);
            box-shadow:var(--chat-popover-shadow); backdrop-filter:blur(20px); z-index:86;
        }
        .system-prompt-popover.open { display:flex; animation:popDown .16s var(--ease); }
        .system-prompt-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .system-prompt-title { font-size:13.5px; font-weight:700; color:var(--chat-text); }
        .rail-close {
            width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
            color:var(--chat-muted); transition:background .14s var(--ease), color .14s var(--ease);
        }
        .rail-close:hover { background:var(--chat-soft); color:var(--chat-text); }
        .rail-close i, .rail-close svg { width:15px; height:15px; }
        .system-prompt-textarea {
            width:100%; min-height:140px; max-height:36vh; resize:vertical;
            border:1px solid var(--chat-line); border-radius:12px;
            background:var(--chat-panel-2); color:var(--chat-text);
            padding:10px 12px; font-size:13px; line-height:1.65; outline:none;
        }
        .system-prompt-textarea:focus { border-color:var(--chat-line-2); }
        .sys-presets-quick {
            display:flex; align-items:center; gap:6px; flex-wrap:wrap; max-height:66px; overflow:auto;
        }
        .sys-presets-quick:empty { display:none; }
        .sys-presets-quick[hidden] { display:none !important; }
        .sys-preset-pill {
            height:24px; padding:0 9px; border-radius:999px;
            border:1px solid var(--chat-line); background:var(--chat-soft-2);
            color:var(--chat-muted); font-size:11px; font-weight:600;
            white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis;
            transition:all .14s var(--ease);
        }
        .sys-preset-pill:hover { border-color:var(--chat-line-2); color:var(--chat-text); background:var(--chat-soft); }
        .system-prompt-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .system-prompt-actions-right { display:flex; align-items:center; gap:8px; }
        .system-prompt-actions button {
            height:30px; padding:0 12px; border-radius:9px; font-size:12px; font-weight:650;
            border:1px solid var(--chat-line); background:var(--chat-soft-2); color:var(--chat-muted);
        }
        .system-prompt-actions button:hover { background:var(--chat-soft); color:var(--chat-text); border-color:var(--chat-line-2); }
        .system-prompt-actions .primary {
            background:var(--chat-strong); color:var(--chat-strong-text); border-color:var(--chat-strong);
        }
        .system-prompt-actions .primary:hover { opacity:.9; }

        /* ===== Messages Column (Borderless LibTV Reader) ===== */
        .messages {
            width:100%; min-height:0; overflow-y:auto; overflow-x:hidden;
            padding:18px max(24px, calc((100% - var(--chat-width)) / 2)) 28px;
            display:flex; flex-direction:column; align-items:center; gap:20px;
            scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;
        }
        .messages::-webkit-scrollbar { width:0; height:0; display:none; }

        /* Welcome Empty State */
        .empty-state {
            margin:auto; width:100%; max-width:520px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; padding:16px 8px;
        }
        .welcome-orb {
            width:54px; height:54px; border-radius:50%; margin-bottom:18px;
            background:radial-gradient(circle at 32% 28%, #c7e3ff 0%, #60a5fa 42%, #3b5bdb 78%, #1d2658 100%);
            box-shadow:0 0 38px rgba(96,165,250,.32), inset 0 -8px 16px rgba(15,23,42,.38);
        }
        .welcome-title {
            font-size:20px; font-weight:750; color:var(--chat-text); letter-spacing:-.01em; margin:0 0 8px;
        }
        .welcome-sub {
            font-size:13px; color:var(--chat-muted); line-height:1.6; max-width:440px; margin:0 0 22px;
        }
        .starter-list {
            width:100%; display:flex; flex-direction:column; gap:8px;
        }
        .starter-item {
            width:100%; padding:11px 14px; border-radius:12px;
            border:1px solid var(--chat-line); background:var(--chat-panel);
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            text-align:left; color:var(--chat-text); font-size:13px; font-weight:550;
            transition:background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
        }
        .starter-item:hover {
            background:var(--chat-soft-2); border-color:var(--chat-line-2); transform:translateY(-1px);
        }
        .starter-left { display:flex; align-items:center; gap:10px; min-width:0; }
        .starter-left i, .starter-left svg { width:16px; height:16px; color:var(--chat-muted); flex:0 0 auto; }
        .starter-right { width:15px; height:15px; color:var(--chat-faint); flex:0 0 auto; transition:transform .15s var(--ease), color .15s var(--ease); }
        .starter-item:hover .starter-right { transform:translateX(2px); color:var(--chat-text); }

        /* Message Bubbles */
        .bubble-row {
            width:100%; max-width:var(--chat-width);
            display:flex; gap:10px; align-items:flex-end; justify-content:flex-start;
        }
        .bubble-row.user { justify-content:flex-end; }
        .bubble {
            overflow:visible; font-size:14.5px; line-height:1.72; word-break:break-word;
        }
        .bubble.user {
            max-width:min(76%, 560px); padding:10px 15px; border-radius:16px;
            background:var(--chat-user-bg); color:var(--chat-user-text);
            border:1px solid var(--chat-line); white-space:pre-wrap;
        }
        .bubble.assistant {
            width:100%; max-width:100%; padding:2px 0;
            background:transparent; border:0; border-radius:0; box-shadow:none;
            color:var(--chat-text); white-space:normal;
        }
        .bubble.assistant .bubble-text {
            font-size:14.5px; line-height:1.76; color:var(--chat-text);
        }
        .bubble.assistant .bubble-text:empty { display:none; }
        .bubble.assistant.image-bubble .bubble-text {
            color:var(--chat-text); margin-bottom:10px;
        }
        .bubble-text p { margin:0 0 10px; }
        .bubble-text p:last-child { margin-bottom:0; }
        .bubble-text ul, .bubble-text ol { margin:6px 0 10px; padding-left:20px; }
        .bubble-text li { margin:4px 0; }
        .bubble-text strong { font-weight:700; color:var(--chat-text); }
        .bubble-text code {
            font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            font-size:.88em; padding:1px 6px; border-radius:6px;
            background:var(--chat-soft); border:1px solid var(--chat-line);
        }
        .bubble-text pre.code-block {
            margin:10px 0; padding:12px 14px; border-radius:12px; overflow:auto;
            background:var(--chat-panel-2); border:1px solid var(--chat-line);
            font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            font-size:12.5px; line-height:1.55; white-space:pre;
        }
        .bubble.assistant.streaming::after {
            content:""; display:inline-block; width:6px; height:1.15em; margin-left:4px;
            border-radius:999px; background:var(--chat-text); vertical-align:-.18em;
            animation:cursorBlink .9s steps(2,end) infinite;
        }

        /* Reasoning Block Above Assistant Reply (Screenshot 1 Style) */
        .message-detail {
            margin:0 0 10px; white-space:normal; color:var(--chat-muted); font-size:12.5px;
        }
        .message-detail.prompt-detail { margin:10px 0 0; }
        .message-detail summary {
            list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
            color:var(--chat-muted); font-size:12.5px; font-weight:550; padding:3px 0;
            user-select:none; transition:color .14s var(--ease);
        }
        .message-detail summary::-webkit-details-marker { display:none; }
        .message-detail summary:hover { color:var(--chat-text); }
        .message-detail summary i, .message-detail summary svg { width:14px; height:14px; flex:0 0 auto; }
        .message-detail summary .detail-chevron { transition:transform .16s var(--ease); opacity:.75; }
        .message-detail[open] summary .detail-chevron { transform:rotate(180deg); }
        .message-detail pre {
            margin:6px 0 2px 4px; padding:8px 12px; border-left:2px solid var(--chat-line-2);
            font:inherit; font-size:12px; line-height:1.6; color:var(--chat-muted);
            white-space:pre-wrap; overflow-wrap:anywhere; max-height:240px; overflow:auto;
        }

        /* Attachments & Generated Images */
        .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
        .thumb {
            width:58px; height:58px; border-radius:10px; object-fit:cover;
            border:1px solid var(--chat-line); cursor:zoom-in;
        }
        .thumb.file-thumb {
            width:auto; height:38px; max-width:220px; padding:0 10px;
            display:flex; align-items:center; gap:7px; cursor:default;
            background:var(--chat-soft-2); color:currentColor; font-size:11.5px; font-weight:600;
        }
        .thumb.file-thumb i, .thumb.file-thumb svg { width:14px; height:14px; flex:0 0 auto; color:var(--chat-muted); }
        .thumb-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .generated-grid { display:grid; gap:10px; margin-top:4px; }
        .generated-grid.count-1 { grid-template-columns:minmax(0, auto); }
        .generated-grid.count-2,
        .generated-grid.count-3,
        .generated-grid.count-4 { grid-template-columns:repeat(2, minmax(0, 290px)); }
        .generated-card {
            position:relative; width:fit-content; max-width:min(460px, 100%);
            border-radius:14px; overflow:hidden; border:1px solid var(--chat-line);
            background:var(--chat-panel-2);
        }
        .generated-grid.count-2 .generated-card,
        .generated-grid.count-3 .generated-card,
        .generated-grid.count-4 .generated-card { width:100%; max-width:290px; }
        .generated-card img.generated {
            display:block; width:auto; max-width:100%; max-height:min(48vh, 460px);
            height:auto; object-fit:contain; cursor:zoom-in;
        }
        .generated-card-tools {
            position:absolute; right:8px; bottom:8px;
            display:flex; align-items:center; gap:4px; padding:4px;
            border-radius:10px; background:rgba(14,15,18,.78);
            backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14);
            opacity:0; transform:translateY(3px);
            transition:opacity .16s var(--ease), transform .16s var(--ease);
        }
        .generated-card:hover .generated-card-tools,
        .generated-card:focus-within .generated-card-tools {
            opacity:1; transform:translateY(0);
        }
        .generated-card-tools button,
        .generated-card-tools a {
            height:26px; padding:0 8px; border-radius:7px;
            display:inline-flex; align-items:center; gap:4px;
            color:#f4f4f5; font-size:11px; font-weight:600; text-decoration:none;
            transition:background .14s var(--ease);
        }
        .generated-card-tools button:hover,
        .generated-card-tools a:hover { background:rgba(255,255,255,.14); }
        .generated-card-tools i, .generated-card-tools svg { width:13px; height:13px; }

        .message-status {
            margin-top:8px; color:var(--chat-muted); font-size:12.5px;
            display:flex; align-items:center; gap:7px; white-space:pre-wrap;
        }
        .message-status[hidden] { display:none !important; }
        .message-status.error { color:#ef4444; }
        .message-status-dot {
            width:7px; height:7px; border-radius:50%; background:#60a5fa;
            flex:0 0 auto; animation:cursorBlink 1.1s ease-in-out infinite;
        }
        .message-status.error .message-status-dot { background:#ef4444; animation:none; }

        /* Minimalist Ghost Actions Below Assistant Reply */
        .message-actions {
            display:flex; align-items:center; gap:2px; margin-top:10px; flex-wrap:wrap;
        }
        .message-actions button {
            height:28px; min-width:28px; padding:0 7px; border-radius:7px;
            display:inline-flex; align-items:center; justify-content:center; gap:5px;
            color:var(--chat-muted); font-size:11.5px; font-weight:550;
            transition:background .14s var(--ease), color .14s var(--ease);
        }
        .message-actions button:hover { background:var(--chat-soft-2); color:var(--chat-text); }
        .message-actions i, .message-actions svg { width:14px; height:14px; }
        .message-model-tag {
            margin-left:auto; font-size:11px; font-weight:500;
            color:var(--chat-faint); letter-spacing:.01em;
        }

        /* ===== Bottom Composer (LibTV Screenshot 1 Exact Layout) ===== */
        .composer-wrap {
            min-height:0; padding:8px 24px 18px;
            background:linear-gradient(to top, var(--chat-bg) 82%, transparent); z-index:12;
        }
        .composer {
            width:min(var(--chat-width), 100%); margin:0 auto;
            background:var(--chat-panel); border:1px solid var(--chat-line);
            border-radius:20px; box-shadow:0 16px 42px var(--chat-shadow);
            padding:12px 14px 10px; display:flex; flex-direction:column; gap:6px;
            transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
            overflow:visible;
        }
        .composer:focus-within {
            border-color:var(--chat-line-2);
        }
        .composer.drag-over {
            border-color:#60a5fa;
            box-shadow:0 0 0 2px rgba(96,165,250,.22), 0 16px 42px var(--chat-shadow);
        }
        .composer-body {
            display:flex; flex-direction:column; gap:8px; min-width:0; background:transparent; border:0;
        }
        /* Top Reference Chips Strip Inside Composer */
        .ref-strip {
            display:flex; align-items:center; gap:6px; overflow-x:auto; min-width:0; max-width:100%;
            padding-bottom:2px; scrollbar-width:none;
        }
        .ref-strip::-webkit-scrollbar { height:0; display:none; }
        .ref-strip:empty { display:none; }
        .ref-chip {
            height:30px; padding:3px 6px 3px 4px; border-radius:8px; flex:0 0 auto;
            display:inline-flex; align-items:center; gap:6px;
            background:var(--chat-soft); border:1px solid var(--chat-line); color:var(--chat-text);
            max-width:200px;
        }
        .ref-chip img {
            width:22px; height:22px; border-radius:5px; object-fit:cover; flex:0 0 auto; cursor:zoom-in;
        }
        .ref-chip-name {
            min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            font-size:12px; font-weight:550;
        }
        .ref-chip.file i, .ref-chip.file svg { width:14px; height:14px; color:var(--chat-muted); flex:0 0 auto; margin-left:3px; }
        .ref-chip button {
            width:16px; height:16px; border-radius:50%; flex:0 0 auto;
            display:inline-flex; align-items:center; justify-content:center;
            color:var(--chat-muted); font-size:13px; line-height:1;
            transition:background .14s var(--ease), color .14s var(--ease);
        }
        .ref-chip button:hover { background:var(--chat-line-2); color:var(--chat-text); }

        textarea#messageInput {
            width:100%; min-height:48px; max-height:160px; resize:none; outline:none; border:0;
            padding:2px 2px 6px; font-size:14px; line-height:1.6;
            background:transparent; color:var(--chat-text);
        }
        textarea#messageInput::placeholder { color:var(--chat-faint); }

        .composer-inside-foot {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding-top:2px;
        }
        .left-tools {
            display:flex; align-items:center; gap:4px; min-width:0; flex-wrap:wrap; flex:1;
        }
        .inline-controls {
            display:flex; align-items:center; gap:4px; min-width:0; flex-wrap:wrap;
        }
        .file-input { display:none; }

        /* Icon-First Composer Toolbar Buttons */
        .tool-trigger-btn {
            height:32px; padding:0 9px; border-radius:9px;
            display:inline-flex; align-items:center; justify-content:center; gap:5px;
            color:var(--chat-muted); font-size:12px; font-weight:550;
            transition:background .14s var(--ease), color .14s var(--ease);
            max-width:190px;
        }
        .tool-trigger-btn.icon-only { width:32px; padding:0; }
        .tool-trigger-btn:hover,
        .tool-trigger-btn.open { background:var(--chat-soft); color:var(--chat-text); }
        .tool-trigger-btn i, .tool-trigger-btn svg { width:16px; height:16px; flex:0 0 auto; }
        .tool-trigger-text {
            min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .tool-badge {
            min-width:16px; height:16px; padding:0 4px; border-radius:999px;
            background:#3b82f6; color:#ffffff; font-size:10px; font-weight:700;
            display:inline-flex; align-items:center; justify-content:center;
        }
        .tool-badge:empty { display:none; }

        .image-controls { display:inline-flex; align-items:center; }
        .image-controls.hidden { display:none; }
        .thinking-control {
            display:inline-flex; align-items:center; gap:4px; height:32px; padding:0 6px;
            border-radius:9px; color:var(--chat-muted); font-size:12px;
            transition:background .14s var(--ease), color .14s var(--ease);
        }
        .thinking-control:hover { background:var(--chat-soft); color:var(--chat-text); }
        .thinking-control.hidden { display:none; }
        .thinking-control i, .thinking-control svg { width:14px; height:14px; flex:0 0 auto; }
        .thinking-control select {
            background:transparent; border:0; outline:none; color:var(--chat-text);
            font-size:12px; font-weight:550; cursor:pointer; padding-right:2px;
        }
        .thinking-control select:disabled { color:var(--chat-faint); cursor:not-allowed; }

        /* Circular White Send Arrow Button */
        .send-btn {
            width:34px; height:34px; border-radius:999px; flex:0 0 auto;
            display:inline-flex; align-items:center; justify-content:center;
            background:var(--chat-soft); color:var(--chat-muted);
            transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease), opacity .15s var(--ease);
        }
        .send-btn.has-text {
            background:var(--chat-strong); color:var(--chat-strong-text);
        }
        .send-btn.has-text:hover:not(:disabled) { transform:translateY(-1px); }
        .send-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        .send-btn i, .send-btn svg { width:17px; height:17px; }

        /* ===== Floating Upward Popovers (Fixed Portals for Zero Clipping) ===== */
        .floating-popover {
            position:fixed; left:var(--pop-left, 20px); top:var(--pop-top, 120px);
            width:var(--pop-width, 280px); max-height:var(--pop-max-height, 420px);
            display:none; flex-direction:column; overflow:hidden;
            background:var(--chat-popover-bg); border:1px solid var(--chat-line);
            border-radius:16px; color:var(--chat-text);
            box-shadow:var(--chat-popover-shadow); backdrop-filter:blur(22px);
            z-index:9999;
        }
        .floating-popover.open { display:flex; animation:popIn .15s var(--ease); }

        /* Popover 1: + Attach Menu (Screenshot 6) */
        .attach-menu-popover { border-radius:13px; padding:6px; gap:2px; }
        .menu-row-btn {
            width:100%; height:36px; padding:0 10px; border-radius:9px;
            display:flex; align-items:center; gap:9px; text-align:left;
            color:var(--chat-text); font-size:13px; font-weight:500;
            transition:background .13s var(--ease);
        }
        .menu-row-btn:hover { background:var(--chat-soft); }
        .menu-row-btn i, .menu-row-btn svg { width:16px; height:16px; color:var(--chat-muted); flex:0 0 auto; }

        /* Popover 4: Execution Mode Menu (Screenshot 5) */
        .mode-menu-popover { border-radius:15px; padding:6px; gap:3px; }
        .mode-option-btn {
            width:100%; padding:9px 10px; border-radius:10px;
            display:grid; grid-template-columns:20px minmax(0,1fr) 16px; align-items:start; gap:9px;
            text-align:left; transition:background .13s var(--ease);
        }
        .mode-option-btn:hover,
        .mode-option-btn.active { background:var(--chat-soft); }
        .mode-option-btn .mode-opt-icon { width:17px; height:17px; margin-top:2px; color:var(--chat-text); }
        .mode-opt-title { font-size:13px; font-weight:650; color:var(--chat-text); line-height:1.35; }
        .mode-opt-desc { font-size:11.5px; color:var(--chat-muted); line-height:1.4; margin-top:2px; }
        .mode-opt-check { width:15px; height:15px; margin-top:2px; color:var(--chat-text); opacity:0; }
        .mode-option-btn.active .mode-opt-check { opacity:1; }

        /* Popover 2: 选择模型 (Screenshot 3) */
        .model-picker-popover { padding:14px 12px 10px; gap:10px; }
        .model-picker-title { font-size:15px; font-weight:700; color:var(--chat-text); padding:0 2px; }
        .model-picker-scope {
            display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:3px;
            border-radius:10px; background:var(--chat-panel-2); border:1px solid var(--chat-line);
        }
        .model-picker-scope button {
            height:30px; border-radius:7px; font-size:12.5px; font-weight:650;
            color:var(--chat-muted); transition:all .14s var(--ease);
        }
        .model-picker-scope button.active {
            background:var(--chat-soft-2); color:var(--chat-text);
            box-shadow:0 1px 4px rgba(0,0,0,.18);
        }
        .provider-pills {
            display:flex; align-items:center; gap:5px; overflow-x:auto; padding-bottom:2px;
            scrollbar-width:none; flex:0 0 auto;
        }
        .provider-pills::-webkit-scrollbar { height:0; display:none; }
        .provider-pill {
            height:25px; padding:0 9px; border-radius:999px; flex:0 0 auto;
            border:1px solid var(--chat-line); background:transparent;
            color:var(--chat-muted); font-size:11.5px; font-weight:600; white-space:nowrap;
            transition:all .14s var(--ease);
        }
        .provider-pill:hover { color:var(--chat-text); border-color:var(--chat-line-2); }
        .provider-pill.active {
            background:var(--chat-strong); color:var(--chat-strong-text); border-color:var(--chat-strong);
        }
        .model-cards-list {
            flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:3px;
            padding-right:2px; scrollbar-width:thin;
        }
        .model-card-row {
            width:100%; padding:8px 8px; border-radius:11px;
            display:grid; grid-template-columns:36px minmax(0,1fr) 22px; align-items:center; gap:10px;
            text-align:left; transition:background .13s var(--ease);
        }
        .model-card-row:hover { background:var(--chat-soft-2); }
        .model-card-row.active { background:var(--chat-soft); }
        .model-card-badge {
            width:36px; height:36px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            background:var(--chat-soft); border:1px solid var(--chat-line); color:var(--chat-text);
        }
        .model-card-badge i, .model-card-badge svg { width:17px; height:17px; }
        .model-card-meta { min-width:0; }
        .model-card-name {
            font-size:13px; font-weight:650; color:var(--chat-text);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .model-card-desc {
            font-size:11.5px; color:var(--chat-muted); margin-top:2px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .model-card-status {
            width:20px; height:20px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            color:var(--chat-muted);
        }
        .model-card-row.active .model-card-status {
            background:var(--chat-strong); color:var(--chat-strong-text);
        }
        .model-card-status i, .model-card-status svg { width:13px; height:13px; }
        .model-picker-empty { padding:20px 10px; color:var(--chat-faint); font-size:12px; text-align:center; }

        /* Popover 3: Skill & Presets (Screenshot 4) */
        .skill-picker-popover { padding:14px; gap:10px; }
        .skill-pop-head {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
        }
        .skill-pop-title { font-size:15px; font-weight:700; color:var(--chat-text); }
        .skill-pop-actions { display:flex; align-items:center; gap:6px; }
        .skill-head-btn {
            height:27px; padding:0 10px; border-radius:8px;
            background:var(--chat-soft); color:var(--chat-text);
            font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:4px;
            transition:background .14s var(--ease);
        }
        .skill-head-btn:hover { background:var(--chat-soft-2); }
        .skill-head-btn i, .skill-head-btn svg { width:13px; height:13px; }
        .skill-filter-bar {
            display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
        }
        .skill-tabs { display:flex; align-items:center; gap:4px; }
        .skill-tab-btn {
            height:26px; padding:0 9px; border-radius:7px;
            font-size:12px; font-weight:550; color:var(--chat-muted);
            transition:all .13s var(--ease);
        }
        .skill-tab-btn:hover { color:var(--chat-text); }
        .skill-tab-btn.active { background:var(--chat-soft); color:var(--chat-text); font-weight:650; }
        .skill-search-wrap {
            position:relative; flex:1; min-width:130px; max-width:210px;
        }
        .skill-search-wrap i, .skill-search-wrap svg {
            position:absolute; left:9px; top:50%; transform:translateY(-50%);
            width:13px; height:13px; color:var(--chat-faint); pointer-events:none;
        }
        .skill-search-input {
            width:100%; height:28px; padding:0 10px 0 28px; border-radius:8px;
            border:1px solid var(--chat-line); background:var(--chat-panel-2);
            color:var(--chat-text); font-size:12px; outline:none;
        }
        .skill-search-input:focus { border-color:var(--chat-line-2); }
        .skill-pop-body {
            flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); gap:10px; overflow:hidden;
        }
        .skill-items-list {
            min-height:0; max-height:300px; overflow-y:auto;
            display:flex; flex-direction:column; gap:4px; padding-right:2px;
        }
        .skill-row {
            width:100%; padding:8px 9px; border-radius:10px;
            display:grid; grid-template-columns:32px minmax(0,1fr) auto; align-items:center; gap:10px;
            text-align:left; border:1px solid transparent; transition:background .13s var(--ease), border-color .13s var(--ease);
        }
        .skill-row:hover { background:var(--chat-soft-2); }
        .skill-row.active { background:var(--chat-soft); border-color:var(--chat-active-border); }
        .skill-row-icon {
            width:32px; height:32px; border-radius:9px;
            display:flex; align-items:center; justify-content:center;
            background:var(--chat-panel-2); border:1px solid var(--chat-line); color:var(--chat-text);
        }
        .skill-row-icon i, .skill-row-icon svg { width:15px; height:15px; }
        .skill-row-main { min-width:0; }
        .skill-row-top { display:flex; align-items:center; gap:6px; min-width:0; }
        .skill-row-title {
            font-size:13px; font-weight:650; color:var(--chat-text);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .skill-row-slug {
            font-size:10.5px; padding:1px 6px; border-radius:6px;
            background:var(--chat-panel-2); color:var(--chat-muted); flex:0 0 auto;
            max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .skill-row-desc {
            font-size:11.5px; color:var(--chat-muted); margin-top:2px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .skill-row-act {
            height:24px; padding:0 8px; border-radius:7px;
            background:var(--chat-panel-2); border:1px solid var(--chat-line);
            color:var(--chat-muted); font-size:11px; font-weight:600; flex:0 0 auto;
        }
        .skill-row.active .skill-row-act {
            background:var(--chat-strong); color:var(--chat-strong-text); border-color:var(--chat-strong);
        }

        /* Resolution Popover (Preserved with LibTV Glass Finish) */
        .resolution-picker-popover {
            display:none; grid-template-rows:auto minmax(0,1fr); overflow:hidden;
        }
        .resolution-picker-popover.open { display:grid; animation:popIn .15s var(--ease); }
        .resolution-picker-head {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding:12px 12px 10px; border-bottom:1px solid var(--chat-line);
        }
        .resolution-picker-title { color:var(--chat-text); font-size:13px; font-weight:700; }
        .resolution-picker-scope {
            display:flex; align-items:center; gap:3px; padding:3px;
            border:1px solid var(--chat-line); border-radius:10px; background:var(--chat-panel-2);
        }
        .resolution-picker-scope button {
            height:26px; min-width:54px; border-radius:7px; background:transparent;
            color:var(--chat-muted); font-size:11.5px; font-weight:650;
        }
        .resolution-picker-scope button.active {
            background:var(--chat-soft); color:var(--chat-text);
        }
        .resolution-picker-pane { min-height:0; }
        .resolution-picker-pane.hidden { display:none !important; }
        .resolution-picker-pane.preset { display:grid; grid-template-columns:minmax(115px,.82fr) minmax(0,1.18fr); }
        .resolution-picker-pane.custom { padding:12px; }
        .resolution-picker-list {
            min-height:0; max-height:280px; overflow:auto; padding:8px;
            display:flex; flex-direction:column; gap:3px;
        }
        .resolution-picker-list + .resolution-picker-list { border-left:1px solid var(--chat-line); }
        .resolution-picker-option {
            width:100%; min-height:36px; border-radius:9px; padding:6px 10px;
            display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px;
            color:var(--chat-muted); text-align:left;
        }
        .resolution-picker-option:hover,
        .resolution-picker-option.active { background:var(--chat-soft); color:var(--chat-text); }
        .resolution-picker-option span { font-size:12.5px; font-weight:650; }
        .resolution-picker-option small { font-size:10.5px; font-weight:600; opacity:.72; }
        .resolution-custom-box {
            padding:10px; border:1px solid var(--chat-line); border-radius:12px; background:var(--chat-panel-2);
        }
        .resolution-custom-title { margin-bottom:8px; color:var(--chat-text); font-size:12px; font-weight:700; }
        .resolution-custom-row {
            display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto; align-items:center; gap:6px;
        }
        .resolution-custom-row input {
            width:100%; height:30px; min-width:0; border:1px solid var(--chat-line-2);
            border-radius:8px; background:var(--chat-panel); color:var(--chat-text);
            padding:0 8px; font-size:12px; font-weight:600; outline:none;
        }
        .resolution-custom-row button {
            height:30px; border-radius:8px; background:var(--chat-strong); color:var(--chat-strong-text);
            font-size:12px; font-weight:650; padding:0 12px;
        }
        .resolution-custom-hint { margin-top:7px; color:var(--chat-faint); font-size:11px; }
        .resolution-custom-hint.error { color:#ef4444; }

        /* Asset Picker & Image Preview Modals */
        .image-preview-modal,
        .asset-picker-modal {
            position:fixed; inset:0; display:none; align-items:center; justify-content:center;
            padding:24px; background:rgba(10,11,14,.72); backdrop-filter:blur(14px); z-index:10000;
        }
        .image-preview-modal.open,
        .asset-picker-modal.open { display:flex; animation:popIn .16s var(--ease); }
        .image-preview-modal img {
            max-width:min(1180px, 94vw); max-height:88vh; object-fit:contain;
            border-radius:16px; box-shadow:0 24px 70px rgba(0,0,0,.4); background:var(--chat-panel);
        }
        .image-preview-close {
            position:fixed; top:18px; right:18px; width:36px; height:36px; border-radius:10px;
            display:flex; align-items:center; justify-content:center;
            background:var(--chat-panel); color:var(--chat-text); border:1px solid var(--chat-line);
        }
        .asset-picker-dialog {
            width:min(700px, calc(100vw - 32px)); max-height:min(78vh, 640px);
            display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px;
            padding:16px; border-radius:18px; background:var(--chat-popover-bg);
            border:1px solid var(--chat-line); box-shadow:var(--chat-popover-shadow);
            color:var(--chat-text);
        }
        .asset-picker-head {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
        }
        .asset-picker-title { font-size:15px; font-weight:700; }
        .asset-picker-bar {
            display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
        }
        .asset-picker-tabs {
            display:inline-flex; gap:4px; padding:3px; border-radius:10px;
            background:var(--chat-panel-2); border:1px solid var(--chat-line);
        }
        .asset-picker-tabs button {
            height:28px; padding:0 12px; border-radius:7px; font-size:12px; font-weight:600; color:var(--chat-muted);
        }
        .asset-picker-tabs button.active { background:var(--chat-soft); color:var(--chat-text); }
        .asset-picker-grid {
            min-height:180px; overflow-y:auto;
            display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr));
            gap:8px; padding:2px; align-content:start;
        }
        .asset-pick-item {
            position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;
            border:2px solid transparent; background:var(--chat-panel-2);
            transition:border-color .13s var(--ease), transform .13s var(--ease);
        }
        .asset-pick-item:hover { transform:translateY(-1px); border-color:var(--chat-line-2); }
        .asset-pick-item.selected { border-color:#60a5fa; }
        .asset-pick-item img { width:100%; height:100%; object-fit:cover; display:block; }
        .asset-pick-check {
            position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:999px;
            background:rgba(14,15,18,.65); border:1px solid rgba(255,255,255,.3);
            color:#ffffff; display:flex; align-items:center; justify-content:center;
            opacity:0; transition:opacity .12s var(--ease);
        }
        .asset-pick-item:hover .asset-pick-check,
        .asset-pick-item.selected .asset-pick-check { opacity:1; }
        .asset-pick-item.selected .asset-pick-check { background:#3b82f6; border-color:#3b82f6; }
        .asset-pick-check i, .asset-pick-check svg { width:12px; height:12px; }
        .asset-pick-label {
            position:absolute; left:0; right:0; bottom:0; padding:12px 6px 4px;
            background:linear-gradient(to top, rgba(0,0,0,.76), transparent);
            color:#f4f4f5; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            text-align:left;
        }
        .asset-picker-foot {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding-top:6px; border-top:1px solid var(--chat-line);
        }
        .asset-picker-foot button {
            height:32px; padding:0 14px; border-radius:9px; font-size:12.5px; font-weight:650;

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });

        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const CHAT_ATTACHMENT_MAX = 20;
        const CHAT_SIZE_MODE_VERSION = 2;
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        const STARTER_PROMPTS = [
            {
                icon: 'layers',
                title: '多参考图产品与包装替换',
                mode: 'agent',
                prompt: '请以图1为主场景与构图光影，把画面中的产品替换为图2的完整包装外观，严格保持图2的造型、配色与标签细节，去除原场景多余文案，自然融入光影。'
            },
            {
                icon: 'wand-sparkles',
                title: '严格保留主体智能换背景',
                mode: 'agent',
                prompt: '严格保持参考图中主体人物/商品的外形、材质、结构与姿态完全不变，将背景替换为高级极简的商业棚拍浅灰柔光背景，并自然重塑地面接触阴影。'
            },
            {
                icon: 'scan-search',
                title: '反推参考图高精度提示词',
                mode: 'chat',
                prompt: '请分析我上传的参考图，从主体细节、构图视角、材质质感、灯光色温与摄影风格五个维度，帮我提炼一段可直接用于生图的精细提示词。'
            },
            {
                icon: 'camera',
                title: '同主体多视角商业精修',
                mode: 'agent',
                prompt: '基于参考图中的核心主体与视觉风格，保持材质和品牌视觉一致性，微调镜头角度与构图张力，生成一张商业广告级高清精修海报图。'
            }
        ];

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        async function responseErrorMessage(response, fallback){
            let raw = '';
            try { raw = await response.text(); } catch(e) {}
            if(raw){
                try {
                    const parsed = JSON.parse(raw);
                    const detail = parsed?.detail || parsed?.error?.message || parsed?.message;
                    if(detail) return String(detail);
                } catch(e) {}
                const compact = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                if(compact) return compact.slice(0, 800);
            }
            return fallback;
        }

        const savedChatSettings = readChatSettings();
        let conversations = [];
        let currentConversation = null;
        let mode = ['chat','agent','image'].includes(savedChatSettings.mode) ? savedChatSettings.mode : 'agent';
        let reasoningEffort = ['low','medium','high'].includes(savedChatSettings.reasoningEffort) ? savedChatSettings.reasoningEffort : '';
        let sending = false;
        let activeTaskStreamController = null;
        let activeTaskStreamId = '';
        const renderedBubblesById = new Map();
        let provider = savedChatSettings.provider || 'comfly';
        let msModel = savedChatSettings.msModel || '';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let systemPrompt = String(savedChatSettings.systemPrompt || '').trim();
        let chatSkillIds = Array.isArray(savedChatSettings.chatSkillIds) ? savedChatSettings.chatSkillIds.map(String) : [];
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = ['square','portrait','portrait43','landscape43','landscape','story','wide'].includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = savedChatSettings.chatSizeModeVersion === CHAT_SIZE_MODE_VERSION && ['auto','1k','2k','4k','custom'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : 'auto';
        let chatPresetResolution = ['1k','2k','4k'].includes(savedChatSettings.chatPresetResolution) ? savedChatSettings.chatPresetResolution : (chatResolution === 'custom' ? '1k' : chatResolution);
        let chatCustomSize = normalizeChatCustomSize(savedChatSettings.chatCustomSize || '') || '1024x1024';
        let modelPickerScope = savedChatSettings.modelPickerScope === 'chat' ? 'chat' : 'image';
        let refs = [];
        let promptPresets = [];
        let skillFilterTab = 'all';
        let assetPickerSource = 'library';
        let assetPickerItems = { library: [], history: [] };
        let assetPickerSelected = new Set();
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-2', ms_chat_models: [] };

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k'], ['2048x2048','4k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k'], ['1365x2048','4k']],
            portrait43: [['1008x1344','1k'], ['1536x2048','2k'], ['2448x3264','4k']],
            landscape43: [['1344x1008','1k'], ['2048x1536','2k'], ['3264x2448','4k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k'], ['2048x1365','4k']],
            story: [['720x1280','1k'], ['1080x1920','2k'], ['1440x2560','4k']],
            wide: [['1280x720','1k'], ['1920x1080','2k'], ['2560x1440','4k']]
        };
        const CHAT_RATIO_VALUES = {
            square:'1:1', portrait:'2:3', landscape:'3:2', portrait43:'3:4',

        function positionFloatingPopover(btnEl, popEl, opts = {}){
            if(!btnEl || !popEl) return;
            const rect = btnEl.getBoundingClientRect();
            const viewportW = window.visualViewport?.width || window.innerWidth;
            const viewportH = window.visualViewport?.height || window.innerHeight;
            const width = Math.min(opts.width || 320, Math.max(160, viewportW - 24));
            const availAbove = Math.max(120, rect.top - 16);
            const maxHeight = Math.min(opts.maxHeight || 420, availAbove, viewportH - 32);
            const left = Math.min(Math.max(12, rect.left), Math.max(12, viewportW - width - 12));
            popEl.style.setProperty('--pop-width', `${Math.round(width)}px`);
            popEl.style.setProperty('--pop-max-height', `${Math.round(maxHeight)}px`);
            popEl.style.setProperty('--pop-left', `${Math.round(left)}px`);
            popEl.style.setProperty('--pop-top', `${Math.max(12, Math.round(rect.top - maxHeight - 8))}px`);
            requestAnimationFrame(() => {
                const box = popEl.getBoundingClientRect();
                const actualH = Math.min(maxHeight, Math.ceil(box.height || popEl.scrollHeight || 160));
                const nextTop = rect.top - actualH - 8 >= 12
                    ? rect.top - actualH - 8
                    : Math.min(viewportH - actualH - 12, rect.bottom + 8);
                popEl.style.setProperty('--pop-top', `${Math.max(12, Math.round(nextTop))}px`);
            });
        }

            if(shouldOpen){

                pop.classList.add('open');
                positionFloatingPopover(btn, pop, opts);

            } else {
                btn.classList.remove('open');
                pop.classList.remove('open');
            }
            return shouldOpen;

        async function loadAssetPickerData(){
            if(assetPickerSource === 'library' && !assetPickerItems.library.length){
                try {
                    const data = await fetch('/api/asset-library').then(r => r.json());
                    const out = [];
                    const seen = new Set();
                    const libs = data?.library?.libraries || [];
                    libs.forEach(lib => {
                        (lib.categories || []).forEach(cat => {
                            if(cat.type === 'workflow') return;
                            (cat.items || []).forEach(it => {
                                if(it?.url && (!it.kind || it.kind === 'image') && !seen.has(it.url)){
                                    seen.add(it.url);
                                    out.push({ url: it.url, name: it.name || '素材', kind: 'image' });
                                }
                            });
                        });
                    });
                    assetPickerItems.library = out;
                } catch(e) {}
            } else if(assetPickerSource === 'history' && !assetPickerItems.history.length){
                try {
                    const data = await fetch('/api/history?limit=60').then(r => r.json());
                    const out = [];
                    const seen = new Set();
                    (Array.isArray(data) ? data : []).forEach(entry => {
                        (entry.images || []).forEach(img => {
                            const url = typeof img === 'string' ? img : (img?.url || '');
                            if(url && !seen.has(url)){
                                seen.add(url);
                                out.push({ url, name: (entry.prompt || '').slice(0, 26) || '生成图', kind: 'image' });
                            }
                        });
                    });
                    assetPickerItems.history = out;
                } catch(e) {}
            }
        }

                .reverse()
                .find(m => m && m.role === 'assistant' && m.status === 'running' && m.task_id);

        function normalizeChatCustomSize(value){
            const match = String(value || '').trim().match(/^([1-9]\d{2,3})\s*[xX×*]\s*([1-9]\d{2,3})$/);
            if(!match) return '';
            const w = Math.round(Number(match[1]));
            const h = Math.round(Number(match[2]));
            if(w < 256 || h < 256 || w > 8192 || h > 8192) return '';
            return `${w}x${h}`;
        }

        function chatResolutionForRequest(message, requestedSize){
            if(['1k','2k','4k'].includes(chatResolution)) return chatResolution;
            const text = String(message || '');
            if(/4\s*k|4K|超清|超高分辨率/i.test(text)) return '4k';
            if(/2\s*k|2K|高清|高分辨率/i.test(text)) return '2k';
            const edge = Math.max(...String(requestedSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            if(edge >= 2800) return '4k';
            if(edge >= 1600) return '2k';
            return '1k';
        }
        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct){
                const w = Number(direct[2]), h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        /* ===== Message Stream & Formatting ===== */
        function formatInlineMarkdown(escapedLine){
            return escapedLine
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        function renderFormattedText(el, rawText){
            if(!el) return;
            const src = String(rawText || '');
            if(!src){
                el.innerHTML = '';
                return;
            }
            const parts = src.split(/```/);
            const htmlParts = [];
            for(let idx = 0; idx < parts.length; idx++){
                if(idx % 2 === 1){
                    const code = parts[idx].replace(/^[a-zA-Z0-9_-]*\n/, '');
                    htmlParts.push(`<pre class="code-block"><code>${escapeHtml(code)}</code></pre>`);
                    continue;
                }
                const lines = parts[idx].split(/\r?\n/);
                let inList = false;
                let listTag = 'ul';
                let paraLines = [];
                const flushPara = () => {
                    if(!paraLines.length) return;
                    htmlParts.push(`<p>${paraLines.map(l => formatInlineMarkdown(escapeHtml(l))).join('<br>')}</p>`);
                    paraLines = [];
                };
                const flushList = () => {
                    if(!inList) return;
                    htmlParts.push(`</${listTag}>`);
                    inList = false;
                };
                lines.forEach(line => {
                    const trimmed = line.trim();
                    const ulMatch = trimmed.match(/^[-•*]\s+(.+)$/);
                    const olMatch = trimmed.match(/^\d+\.\s+(.+)$/);
                    if(!trimmed){
                        flushPara();
                        flushList();
                    } else if(ulMatch){
                        flushPara();
                        if(!inList || listTag !== 'ul'){ flushList(); htmlParts.push('<ul>'); inList = true; listTag = 'ul'; }
                        htmlParts.push(`<li>${formatInlineMarkdown(escapeHtml(ulMatch[1]))}</li>`);
                    } else if(olMatch){
                        flushPara();
                        if(!inList || listTag !== 'ol'){ flushList(); htmlParts.push('<ol>'); inList = true; listTag = 'ol'; }
                        htmlParts.push(`<li>${formatInlineMarkdown(escapeHtml(olMatch[1]))}</li>`);
                    } else {
                        flushList();
                        paraLines.push(line);
                    }
                });
                flushPara();
                flushList();
            }
            el.innerHTML = htmlParts.join('');
        }

            dlLink.innerHTML = `<i data-lucide="download"></i>`;
            dlLink.onclick = (e) => e.stopPropagation();
            tools.appendChild(editBtn);
            tools.appendChild(zoomBtn);
            tools.appendChild(dlLink);
            card.appendChild(tools);
            return card;
        }

        function useImageAsReference(url){
            if(!url) return;
            if(refs.length >= CHAT_ATTACHMENT_MAX) refs.pop();
            refs.push({ url, name: '生成图参考.png', kind: 'image' });
            renderRefs();
            setMode('agent');
            const input = document.getElementById('messageInput');
            if(input){
                input.focus();
            }
        }

        async function copyMessageText(btn, text){
            if(!text) return;
            try {
                await navigator.clipboard.writeText(text);
                const icon = btn.querySelector('i, svg');
                if(icon){
                    btn.innerHTML = '<i data-lucide="check"></i>';
                    lucide.createIcons();
                    setTimeout(() => {
                        btn.innerHTML = '<i data-lucide="copy"></i>';
                        lucide.createIcons();
                    }, 1400);
                }
            } catch(e) {}
        }

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            if(msg.id) row.dataset.messageId = msg.id;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const imageUrls = Array.isArray(msg.image_urls) && msg.image_urls.length ? msg.image_urls : (msg.image_url ? [msg.image_url] : []);
            const seenImageUrls = new Set(imageUrls);
            if(imageUrls.length) bubble.classList.add('image-bubble');

            if(msg.role === 'user'){
                const text = document.createElement('div');
                text.className = 'bubble-text';
                text.textContent = msg.content || '';
                bubble.appendChild(text);
                if(msg.attachments?.length){
                    const thumbs = document.createElement('div');
                    thumbs.className = 'thumbs';
                    msg.attachments.forEach(ref => thumbs.appendChild(renderAttachmentThumb(ref)));
                    bubble.appendChild(thumbs);
                }
                row.appendChild(bubble);
                box.appendChild(row);
                lucide.createIcons();
                return { row, bubble, text, status: null, seenImageUrls };
            }

            // Assistant reply (borderless LibTV layout)
            const text = document.createElement('div');
            text.className = 'bubble-text';
            const isRunningState = msg.status === 'running';
            const isErrorState = msg.status === 'failed' || msg.status === 'interrupted';
            const displayText = msg.type === 'image'
                ? (msg.agent_reply || ((imageUrls.length || isRunningState || isErrorState) ? '' : tr('chat.generated')))
                : (msg.content || '');
            renderFormattedText(text, displayText);
            bubble.appendChild(text);

            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => thumbs.appendChild(renderAttachmentThumb(ref)));
                bubble.appendChild(thumbs);
            }
            if(imageUrls.length){
                const grid = document.createElement('div');
                grid.className = `generated-grid count-${Math.min(imageUrls.length, 4)}`;
                imageUrls.forEach(url => grid.appendChild(createGeneratedImageCard(url)));
                bubble.appendChild(grid);
            }
            if(msg.reasoning) setMessageDetail(bubble, 'reasoning-detail', '思考过程', msg.reasoning);
            if(msg.type === 'image' && msg.content) setMessageDetail(bubble, 'prompt-detail', '生图文案', msg.content);

            const status = document.createElement('div');
            status.className = 'message-status';
            status.setAttribute('role', 'status');
            status.setAttribute('aria-live', 'polite');
            status.hidden = true;
            if(isRunningState){
                bubble.classList.add('streaming');
                status.hidden = false;
                const runningText = msg.status_text || (msg.type === 'image' ? tr('chat.generatingImage') : '正在思考与连接…');
                status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(runningText)}</span>`;
            } else if(isErrorState){
                status.hidden = false;
                status.classList.add('error');
                const errText = msg.error || msg.generation_error || msg.status_text || tr('chat.requestFailed');
                status.innerHTML = `<span class="message-status-dot"></span><span>${escapeHtml(errText)}</span>`;
            }
            bubble.appendChild(status);

            if(msg.content || imageUrls.length || isErrorState){
                const actions = document.createElement('div');
                actions.className = 'message-actions';
                if(isErrorState && msg.id){
                    const retryBtn = document.createElement('button');
                    retryBtn.type = 'button';
                    retryBtn.title = '重新发送';
                    retryBtn.innerHTML = '<i data-lucide="rotate-cw"></i><span>重试</span>';
                    retryBtn.onclick = () => retryAssistantMessage(msg.id);
                    actions.appendChild(retryBtn);
                }
                if(msg.content){
                    const copyBtn = document.createElement('button');
                    copyBtn.type = 'button';
                    copyBtn.title = '复制内容';
                    copyBtn.innerHTML = '<i data-lucide="copy"></i>';
                    copyBtn.onclick = () => copyMessageText(copyBtn, msg.content);
                    actions.appendChild(copyBtn);
                }
                if(imageUrls.length){
                    const refBtn = document.createElement('button');
                    refBtn.type = 'button';
                    refBtn.title = '作为参考图继续改图';
                    refBtn.innerHTML = '<i data-lucide="wand-sparkles"></i><span>继续改图</span>';
                    refBtn.onclick = () => useImageAsReference(imageUrls[0]);
                    actions.appendChild(refBtn);
                }
                if(msg.content){
                    [
                        { icon:'pencil', title:msg.type === 'image' ? '编辑生图文案' : '编辑文案', image:msg.type === 'image' },
                        { icon:'image-plus', title:'用于生图', image:true }
                    ].forEach(action => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.title = action.title;
                        button.setAttribute('aria-label', action.title);
                        button.innerHTML = `<i data-lucide="${action.icon}"></i>`;
                        button.onclick = () => editMessageDraft(msg, action.image);
                        actions.appendChild(button);
                    });
                }
                if(msg.model){
                    const tag = document.createElement('span');
                    tag.className = 'message-model-tag';
                    tag.textContent = shortModelName(msg.model);
                    actions.appendChild(tag);
                }
                bubble.appendChild(actions);
            }
            row.appendChild(bubble);
            box.appendChild(row);
            lucide.createIcons();
            return { row, bubble, text, status, seenImageUrls };
        }

        function setMessageDetail(bubble, className, title, content){
            let detail = bubble.querySelector(`.${className}`);
            if(!detail){
                detail = document.createElement('details');
                detail.className = `message-detail ${className}`;
                const summary = document.createElement('summary');
                summary.innerHTML = `<i data-lucide="${className === 'reasoning-detail' ? 'clock' : 'file-text'}"></i><span>${escapeHtml(title)}</span><i class="detail-chevron" data-lucide="chevron-down"></i>`;
                detail.appendChild(summary);
                detail.appendChild(document.createElement('pre'));
                if(className === 'reasoning-detail'){
                    const textNode = bubble.querySelector('.bubble-text');
                    bubble.insertBefore(detail, textNode || bubble.firstChild);
                } else {
                    const statusNode = bubble.querySelector('.message-status');
                    bubble.insertBefore(detail, statusNode || null);
                }
                lucide.createIcons();
            }
            detail.querySelector('pre').textContent = content;
            return detail;
        }

        function appendStreamImage(assistantBubble, url){
            if(!url || !assistantBubble?.bubble) return;
            if(assistantBubble.seenImageUrls?.has(url)) return;
            assistantBubble.seenImageUrls?.add(url);
            assistantBubble.bubble.classList.add('image-bubble');
            let grid = assistantBubble.bubble.querySelector('.generated-grid');
            if(!grid){
                grid = document.createElement('div');
                assistantBubble.bubble.insertBefore(grid, assistantBubble.status);
            }
            grid.appendChild(createGeneratedImageCard(url));
            grid.className = `generated-grid count-${Math.min(grid.children.length, 4)}`;
            lucide.createIcons();
        }

        function isImageRef(ref){
            const kind = String(ref?.kind || '').toLowerCase();
            const mime = String(ref?.mime || '').toLowerCase();
            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|avif|tiff?|heic|heif)(\?|#|$)/.test(url);
        }

        function attachmentName(ref){
            return ref?.name || (ref?.url || '').split('/').pop() || '附件';

            if(isImageRef(ref)){
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = ref.url;
                img.title = attachmentName(ref);
                img.onclick = () => openImagePreview(ref.url);

            const node = document.createElement('div');
            node.className = 'thumb file-thumb';

            const label = attachmentName(ref);

                    <img src="${escapeHtml(ref.url)}" title="${escapeHtml(label)}" onclick="openImagePreview('${escapeHtml(ref.url)}')" alt="">
                    <span class="ref-chip-name" title="${escapeHtml(label)}">图片${i + 1} · ${escapeHtml(label)}</span>
                    <button type="button" onclick="removeRef(${i})" aria-label="移除">×</button>

            }
            return `<div class="ref-chip file">
                <i data-lucide="file"></i>
                <span class="ref-chip-name" title="${escapeHtml(label)}">${escapeHtml(label)}</span>
                <button type="button" onclick="removeRef(${i})" aria-label="移除">×</button>
            </div>`;

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, CHAT_ATTACHMENT_MAX - refs.length);
            if(!available) return;
            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => {
                    if(!r.ok) throw new Error(await responseErrorMessage(r, '上传失败'));
                    return r.json();
                });
                refs.push(...(data.files || []));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref, i) => renderRefChip(ref, i)).join('');
            lucide.createIcons();
            updateSendButtonState();
        }

        function removeRef(i){ refs.splice(i, 1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);
            if(files.length) uploadFiles(files);
        });

        const composerBox = document.getElementById('composerBox');
        composerBox.addEventListener('dragover', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBox.classList.add('drag-over');
        });
        composerBox.addEventListener('dragleave', e => {
            if(!composerBox.contains(e.relatedTarget)) composerBox.classList.remove('drag-over');
        });
        composerBox.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBox.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });
